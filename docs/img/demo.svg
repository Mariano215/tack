<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500" role="img" aria-label="Two terminals side by side, each running a different tack profile with its own plugins and config dir">
<title>tack: a different Claude Code setup in each terminal</title>
<style>
  .bg   { fill:#0B0E14; }
  .pane { fill:#11151F; stroke:#232B3A; stroke-width:1.5; }
  .bar  { fill:#1A2130; }
  text  { font-family: ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
  .ttl  { font-size:14px; fill:#8B94A7; }
  .ln   { font-size:15.5px; opacity:1; animation: none 17.0s linear infinite; }
  .cap  { font-size:16px; fill:#8B94A7; opacity:1; animation: none 17.0s linear infinite; }
  .t0_4 { animation-name: k0_4; }  @keyframes k0_4 { 0%,2.353%{opacity:0} 3.353%,97%{opacity:1} 100%{opacity:0} }  .t1_5 { animation-name: k1_5; }  @keyframes k1_5 { 0%,8.824%{opacity:0} 9.824%,97%{opacity:1} 100%{opacity:0} }  .t2_0 { animation-name: k2_0; }  @keyframes k2_0 { 0%,11.765%{opacity:0} 12.765%,97%{opacity:1} 100%{opacity:0} }  .t2_4 { animation-name: k2_4; }  @keyframes k2_4 { 0%,14.118%{opacity:0} 15.118%,97%{opacity:1} 100%{opacity:0} }  .t2_8 { animation-name: k2_8; }  @keyframes k2_8 { 0%,16.471%{opacity:0} 17.471%,97%{opacity:1} 100%{opacity:0} }  .t3_6 { animation-name: k3_6; }  @keyframes k3_6 { 0%,21.176%{opacity:0} 22.176%,97%{opacity:1} 100%{opacity:0} }  .t4_6 { animation-name: k4_6; }  @keyframes k4_6 { 0%,27.059%{opacity:0} 28.059%,97%{opacity:1} 100%{opacity:0} }  .t5_1 { animation-name: k5_1; }  @keyframes k5_1 { 0%,30.000%{opacity:0} 31.000%,97%{opacity:1} 100%{opacity:0} }  .t6_6 { animation-name: k6_6; }  @keyframes k6_6 { 0%,38.824%{opacity:0} 39.824%,97%{opacity:1} 100%{opacity:0} }  .t7_7 { animation-name: k7_7; }  @keyframes k7_7 { 0%,45.294%{opacity:0} 46.294%,97%{opacity:1} 100%{opacity:0} }  .t8_2 { animation-name: k8_2; }  @keyframes k8_2 { 0%,48.235%{opacity:0} 49.235%,97%{opacity:1} 100%{opacity:0} }  .t8_6 { animation-name: k8_6; }  @keyframes k8_6 { 0%,50.588%{opacity:0} 51.588%,97%{opacity:1} 100%{opacity:0} }  .t9_0 { animation-name: k9_0; }  @keyframes k9_0 { 0%,52.941%{opacity:0} 53.941%,97%{opacity:1} 100%{opacity:0} }  .t9_8 { animation-name: k9_8; }  @keyframes k9_8 { 0%,57.647%{opacity:0} 58.647%,97%{opacity:1} 100%{opacity:0} }  .t10_8 { animation-name: k10_8; }  @keyframes k10_8 { 0%,63.529%{opacity:0} 64.529%,97%{opacity:1} 100%{opacity:0} }  .t11_3 { animation-name: k11_3; }  @keyframes k11_3 { 0%,66.471%{opacity:0} 67.471%,97%{opacity:1} 100%{opacity:0} }  .t12_6 { animation-name: k12_6; }  @keyframes k12_6 { 0%,74.118%{opacity:0} 75.118%,97%{opacity:1} 100%{opacity:0} }</style>
<rect class="bg" x="0" y="0" width="1180" height="500" rx="14"/>
<text x="590.0" y="40" text-anchor="middle" font-size="21" fill="#D6DEEA">one machine, one login, two setups</text>
<rect class="pane" x="20" y="74" width="560" height="330" rx="10"/>
<rect class="bar" x="20" y="74" width="560" height="30" rx="10"/>
<rect class="bar" x="20" y="92" width="560" height="12"/>
<circle cx="38" cy="89" r="4.5" fill="#E06C61"/>
<circle cx="54" cy="89" r="4.5" fill="#E0B341"/>
<circle cx="70" cy="89" r="4.5" fill="#5FD13B"/>
<text class="ttl" x="300.0" y="94" text-anchor="middle">terminal 1  —  engineering</text>
<text xml:space="preserve" class="ln t0_4" x="40" y="132" fill="#D4AE66">$ tack tmux dev</text>
<text xml:space="preserve" class="ln t1_5" x="40" y="158" fill="#D6DEEA">==&gt; applying profile: dev</text>
<text xml:space="preserve" class="ln t2_0" x="40" y="184" fill="#7C879B">  settings.json composed</text>
<text xml:space="preserve" class="ln t2_4" x="40" y="210" fill="#7C879B">  engine installed</text>
<text xml:space="preserve" class="ln t2_8" x="40" y="236" fill="#7C879B">  skills installed (23 managed)</text>
<text xml:space="preserve" class="ln t3_6" x="40" y="262" fill="#D4AE66">$ claude</text>
<text xml:space="preserve" class="ln t4_6" x="40" y="288" fill="#5FD13B">  plugins  superpowers feature-dev pyright-lsp</text>
<text xml:space="preserve" class="ln t5_1" x="40" y="314" fill="#5AA9F0">  config   ~/.claude-profiles/dev</text>
<rect class="pane" x="610" y="74" width="560" height="330" rx="10"/>
<rect class="bar" x="610" y="74" width="560" height="30" rx="10"/>
<rect class="bar" x="610" y="92" width="560" height="12"/>
<circle cx="628" cy="89" r="4.5" fill="#E06C61"/>
<circle cx="644" cy="89" r="4.5" fill="#E0B341"/>
<circle cx="660" cy="89" r="4.5" fill="#5FD13B"/>
<text class="ttl" x="890.0" y="94" text-anchor="middle">terminal 2  —  video production</text>
<text xml:space="preserve" class="ln t6_6" x="630" y="132" fill="#D4AE66">$ tack tmux video</text>
<text xml:space="preserve" class="ln t7_7" x="630" y="158" fill="#D6DEEA">==&gt; applying profile: video</text>
<text xml:space="preserve" class="ln t8_2" x="630" y="184" fill="#7C879B">  settings.json composed</text>
<text xml:space="preserve" class="ln t8_6" x="630" y="210" fill="#7C879B">  engine installed</text>
<text xml:space="preserve" class="ln t9_0" x="630" y="236" fill="#7C879B">  skills installed (11 managed)</text>
<text xml:space="preserve" class="ln t9_8" x="630" y="262" fill="#D4AE66">$ claude</text>
<text xml:space="preserve" class="ln t10_8" x="630" y="288" fill="#A97BE8">  plugins  ui-ux-pro-max frontend-slides</text>
<text xml:space="preserve" class="ln t11_3" x="630" y="314" fill="#5AA9F0">  config   ~/.claude-profiles/video</text>
<text class="cap t12_6" x="590.0" y="448" text-anchor="middle">separate config dirs &#183; shared login &#183; shared plugins tree</text>
</svg>
